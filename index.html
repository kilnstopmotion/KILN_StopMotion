<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KILN StopMotion</title>
  <meta name="description" content="KILN StopMotion — official project page." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.07), transparent 34%),
        #0a0a0b;
      color: #f4f4f5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(920px, calc(100% - 40px));
      text-align: center;
      padding: 72px 24px;
    }
    .badge {
      display: inline-block;
      padding: 8px 13px;
      border: 1px solid #303036;
      border-radius: 999px;
      color: #a1a1aa;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      background: rgba(255,255,255,.025);
    }
    h1 {
      margin: 26px 0 14px;
      font-size: clamp(44px, 8vw, 92px);
      line-height: .94;
      letter-spacing: -.06em;
    }
    p {
      margin: 0 auto;
      max-width: 640px;
      color: #a1a1aa;
      font-size: clamp(16px, 2.2vw, 20px);
      line-height: 1.65;
    }
    .actions {
      margin-top: 34px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      border: 1px solid #34343a;
      text-decoration: none;
      color: #f4f4f5;
      background: #17171a;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .button:hover {
      transform: translateY(-2px);
      border-color: #55555f;
      background: #1e1e22;
    }
    .status {
      margin-top: 26px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #d4d4d8;
      font-size: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 18px rgba(34,197,94,.65);
    }
    .version {
      margin-top: 14px;
      color: #71717a;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">KILN Studio</span>
    <h1>KILN StopMotion</h1>
    <p>A dedicated stop-motion workspace is being built here. This is the live web home for KILN StopMotion.</p>

    <div class="actions">
      <a class="button" href="https://github.com/kilnstopmotion/KILN_StopMotion" target="_blank" rel="noreferrer">View GitHub</a>
    </div>

    <div class="status"><span class="dot"></span> Live deployment ready</div>
    <div class="version">Prototype v0.1</div>
  </main>
</body>
</html>
