<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KILN StopMotion</title>
  <meta name="description" content="KILN StopMotion — official project page." />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0c;
      color: #f4f4f5;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(900px, calc(100% - 40px));
      text-align: center;
      padding: 64px 24px;
    }
    .badge {
      display: inline-block;
      padding: 7px 12px;
      border: 1px solid #2d2d31;
      border-radius: 999px;
      color: #a1a1aa;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(42px, 8vw, 88px);
      line-height: .95;
      letter-spacing: -.055em;
    }
    p {
      margin: 0 auto;
      max-width: 620px;
      color: #a1a1aa;
      font-size: clamp(16px, 2.5vw, 20px);
      line-height: 1.65;
    }
    .status {
      margin-top: 34px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #d4d4d8;
      font-size: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 18px rgba(34,197,94,.65);
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">KILN Studio</span>
    <h1>KILN StopMotion</h1>
    <p>A dedicated stop-motion workspace is being built here. This page is the first live deployment test.</p>
    <div class="status"><span class="dot"></span> Website is working</div>
  </main>
</body>
</html>
